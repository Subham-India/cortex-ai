services:
  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - cortex-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: cortex-gateway
    restart: unless-stopped
    environment:
      PORT: "8000"
      AUTH_SERVICE_URL: http://auth:8001
      CHAT_SERVICE_URL: http://chat:8002
      AGENT_SERVICE_URL: http://agent:8003
      RAG_SERVICE_URL: http://rag:8004
    ports:
      - "8000:8000"
    depends_on:
      auth:
        condition: service_started
      chat:
        condition: service_started
      agent:
        condition: service_started
      rag:
        condition: service_started
    networks:
      - cortex-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    container_name: cortex-auth
    restart: unless-stopped
    environment:
      PORT: "8001"
      MONGO_URI: ${AUTH_MONGO_URI}
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/services/auth/firebase-service-account.json:/app/firebase-service-account.json:ro
    networks:
      - cortex-network

  chat:
    build:
      context: ./backend/services/chat
      dockerfile: Dockerfile
    container_name: cortex-chat
    restart: unless-stopped
    environment:
      PORT: "8002"
      MONGO_URI: ${CHAT_MONGO_URI}
      AGENT_SERVICE_URL: http://agent:8003
    expose:
      - "8002"
    depends_on:
      agent:
        condition: service_started
    networks:
      - cortex-network

  agent:
    build:
      context: ./backend/services/agent
      dockerfile: Dockerfile
    container_name: cortex-agent
    restart: unless-stopped
    environment:
      PORT: "8003"
      RAG_SERVICE_URL: http://rag:8004
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    expose:
      - "8003"
    depends_on:
      rag:
        condition: service_started
    networks:
      - cortex-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8003/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build:
      context: ./backend/services/rag
      dockerfile: Dockerfile
    container_name: cortex-rag
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    expose:
      - "8004"
    networks:
      - cortex-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_RAG_SERVICE_URL: http://rag:8004
        VITE_AGENT_SERVICE_URL: http://agent:8003
        VITE_API_BASE_URL: http://gateway:8000
    container_name: cortex-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - cortex-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cortex-network:
    driver: bridge